<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <style>
      .sans{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
      .title{font-size:22px;font-weight:700}
      .subtitle{font-size:16px;font-weight:700}
      .body{font-size:14px;fill:#263238}
      .small{font-size:11px;fill:#5f6b73}
      .tiny{font-size:9px;fill:#6f7b82}
      .axis{stroke:#202529;stroke-width:3;fill:none}
      .leader{stroke:#2f363a;stroke-width:1.8;fill:none}
      .wave{stroke:#2f80c1;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#fff;stroke-width:3}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#202529"/>
    </marker>
    <marker id="smallArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#384249"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#9ba7ad" flood-opacity="0.23"/>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="#ffffff"/>

  <!-- (a) Raw CSI -->
  <g id="panel-a" class="sans">
    <rect x="18" y="18" width="612" height="574" rx="4" fill="#fbfbf8" stroke="#eef0ec"/>
    <text x="324" y="54" text-anchor="middle" class="title" fill="#222">(a) Raw CSI 硬件漂移与相位误差影响示意</text>

    <!-- axes -->
    <path d="M67 520 L602 520" class="axis" marker-end="url(#arrow)"/>
    <path d="M67 520 L67 90" class="axis" marker-end="url(#arrow)"/>
    <g stroke="#202529" stroke-width="1.5">
      <path d="M115 520 v-9 M165 520 v-9 M215 520 v-9 M265 520 v-9 M315 520 v-9 M365 520 v-9 M415 520 v-9 M465 520 v-9 M515 520 v-9 M565 520 v-9"/>
      <path d="M67 460 h10 M67 395 h10 M67 330 h10 M67 265 h10 M67 200 h10 M67 135 h10"/>
    </g>

    <text x="333" y="562" text-anchor="middle" class="subtitle" fill="#252a2d">时间 Time</text>
    <text x="32" y="307" text-anchor="middle" class="subtitle" fill="#252a2d" transform="rotate(-90 32 307)">CSI Amplitude in English</text>

    <!-- slowly drifting baseline -->
    <path d="M75 446 C190 434, 300 416, 410 400 S520 382, 590 365" stroke="#747b80" stroke-width="2.4" stroke-dasharray="8 7" fill="none"/>

    <!-- raw CSI waveform -->
    <path class="wave" d="M75 355
      L83 328 L91 281 L99 255 L107 293 L115 345 L123 382 L131 356 L139 314 L147 270 L155 247 L163 276 L171 328 L179 368 L187 387 L195 355 L203 312 L211 267 L219 242 L227 270 L235 319 L243 360 L251 382 L259 349 L267 306 L275 263 L283 238 L291 269 L299 313 L307 356 L315 374
      L321 352 L326 395 L332 169 L338 368 L344 343
      L352 301 L360 253 L368 229 L376 260 L384 310 L392 353 L400 371 L408 334 L416 290 L424 244 L432 219 L440 248 L448 295 L456 339 L464 355
      L472 300 L480 225 L488 157 L496 116 L504 176 L512 266 L520 314
      L528 268 L536 202 L544 146 L552 108 L560 161 L568 245 L576 301 L584 325 L592 284"/>

    <!-- phase-error spike -->
    <path d="M322 420 L322 165" stroke="#e0352f" stroke-width="5"/>
    <path d="M330 420 L330 194" stroke="#ff8b76" stroke-width="2"/>

    <!-- annotations -->
    <text x="84" y="188" class="body" font-weight="700">Human motion response</text>
    <path d="M176 194 C166 215, 154 235, 140 255" class="leader" marker-end="url(#smallArrow)"/>

    <text x="304" y="120" class="body" font-weight="700">noise 脉冲噪声</text>
    <path d="M350 127 L331 165" class="leader" marker-end="url(#smallArrow)"/>

    <text x="483" y="100" class="body" font-weight="700">AGC增益漂移</text>
    <text x="483" y="121" class="body" font-weight="700">AGC gain drift</text>
    <path d="M520 131 L500 166" class="leader" marker-end="url(#smallArrow)"/>

    <text x="205" y="466" class="body" font-weight="700">硬件基线漂移</text>
    <text x="166" y="489" class="body" font-weight="700">Hardware baseline drift</text>
    <path d="M285 454 L307 416" class="leader" marker-end="url(#smallArrow)"/>

    <text x="394" y="434" class="body" font-weight="700">相位误差引入的ICI噪声</text>
    <text x="391" y="457" class="body" font-weight="700">Phase error induced ICI noise</text>
    <path d="M460 421 L420 389" class="leader" marker-end="url(#smallArrow)"/>
  </g>

  <!-- (b) preprocessing pipeline -->
  <g id="panel-b" class="sans">
    <text x="760" y="45" text-anchor="middle" class="title" fill="#333">(b)</text>
    <text x="760" y="70" text-anchor="middle" class="title" fill="#333">Preprocessing imposes</text>
    <text x="760" y="94" text-anchor="middle" class="title" fill="#333">assumptions</text>
    <text x="760" y="121" text-anchor="middle" class="small">example configuration pipeline</text>

    <path d="M690 136 L830 136 L813 165 L707 165 Z" fill="#f5f8fa" stroke="#9ca8ae" stroke-width="2" filter="url(#shadow)"/>
    <text x="760" y="155" text-anchor="middle" class="body" font-weight="700">Raw CSI</text>

    <g filter="url(#shadow)">
      <rect x="675" y="195" width="170" height="48" rx="5" class="box" stroke="#8fd0dd"/>
      <rect x="675" y="274" width="170" height="48" rx="5" class="box" stroke="#8fd0dd"/>
      <rect x="675" y="353" width="170" height="48" rx="5" class="box" stroke="#8fd0dd"/>
      <rect x="675" y="432" width="170" height="48" rx="5" class="box" stroke="#8fd0dd"/>
      <rect x="675" y="511" width="170" height="48" rx="5" class="box" stroke="#8fd0dd"/>
    </g>
    <g class="body" text-anchor="middle" font-weight="700">
      <text x="760" y="225">Denoising</text>
      <text x="760" y="304">Outlier handling</text>
      <text x="760" y="383">Phase calibration</text>
      <text x="760" y="462">Normalization</text>
      <text x="760" y="541">Interpolation</text>
    </g>
    <g class="leader" marker-end="url(#smallArrow)">
      <path d="M760 165 L760 190"/>
      <path d="M760 243 L760 269"/>
      <path d="M760 322 L760 348"/>
      <path d="M760 401 L760 427"/>
      <path d="M760 480 L760 506"/>
      <path d="M760 559 L760 584"/>
    </g>
  </g>

  <!-- (c) different preprocessing -->
  <g id="panel-c" class="sans">
    <text x="1100" y="45" text-anchor="middle" class="title" fill="#d6872b">(c) Different preprocessing</text>
    <text x="1100" y="70" text-anchor="middle" class="title" fill="#d6872b">preserves different information</text>

    <!-- proper -->
    <rect x="925" y="92" width="350" height="135" rx="7" fill="#fff" stroke="#8bc9a3" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="950" cy="117" r="13" fill="#45aa69"/>
    <text x="950" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="974" y="123" class="subtitle" fill="#3c9a5e">Proper preprocessing</text>
    <text x="946" y="159" class="small">|CSI|</text>
    <path d="M990 198 L990 145 M990 198 L1247 198" stroke="#9aa4a9" stroke-width="1.4"/>
    <path d="M1002 184 L1016 166 L1032 185 L1048 153 L1063 177 L1080 142 L1097 170 L1114 134 L1130 171 L1147 147 L1164 178 L1181 141 L1198 167 L1215 151 L1236 171" class="wave" stroke-width="3"/>
    <text x="1219" y="216" class="tiny">Time</text>
    <text x="1108" y="216" text-anchor="middle" class="small">Noise reduced, motion structure preserved</text>

    <!-- over-processing -->
    <rect x="925" y="244" width="350" height="135" rx="7" fill="#fff" stroke="#f2b66c" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="950" cy="269" r="13" fill="#ec9d3e"/>
    <text x="950" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="974" y="275" class="subtitle" fill="#d98522">Over-processing</text>
    <text x="946" y="311" class="small">|CSI|</text>
    <path d="M990 350 L990 297 M990 350 L1247 350" stroke="#9aa4a9" stroke-width="1.4"/>
    <path d="M1003 331 C1025 322,1043 337,1065 325 S1107 330,1128 322 S1170 328,1192 321 S1224 325,1238 319" stroke="#7eb4df" stroke-width="3" fill="none"/>
    <text x="1219" y="368" class="tiny">Time</text>
    <text x="1108" y="368" text-anchor="middle" class="small">Motion peaks weakened or removed</text>

    <!-- phase distortion -->
    <rect x="925" y="396" width="350" height="169" rx="7" fill="#fff" stroke="#ef9c9c" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="950" cy="421" r="13" fill="#d84b4b"/>
    <text x="950" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="974" y="427" class="subtitle" fill="#ca3f3f">Phase distortion</text>
    <text x="1100" y="475" text-anchor="middle" class="body" font-style="italic">φ<tspan baseline-shift="sub" font-size="10">out</tspan>(k) = φ<tspan baseline-shift="sub" font-size="10">raw</tspan>(k) + φ<tspan baseline-shift="sub" font-size="10">cal</tspan>(k)</text>
    <path d="M1100 489 L1100 517" class="leader" marker-end="url(#smallArrow)"/>
    <text x="1100" y="541" text-anchor="middle" class="small">Calibration may alter a phase-related sensing cue</text>
  </g>

  <!-- (d) same model, different conclusions -->
  <g id="panel-d" class="sans">
    <text x="1438" y="45" text-anchor="middle" class="title" fill="#3f88b7">(d) Same model, different</text>
    <text x="1438" y="70" text-anchor="middle" class="title" fill="#3f88b7">conclusions</text>

    <!-- inputs -->
    <rect x="1318" y="116" width="82" height="65" rx="7" fill="#fff" stroke="#8bc9a3" stroke-width="3"/>
    <rect x="1318" y="268" width="82" height="65" rx="7" fill="#fff" stroke="#f2b66c" stroke-width="3"/>
    <rect x="1318" y="420" width="82" height="65" rx="7" fill="#fff" stroke="#ef9c9c" stroke-width="3"/>
    <path d="M1330 158 L1338 139 L1347 158 L1356 132 L1365 151 L1374 136 L1387 153" class="wave" stroke-width="2.5"/>
    <path d="M1330 305 C1340 295,1350 307,1360 298 S1380 303,1388 294" stroke="#83b6dd" stroke-width="2.5" fill="none"/>
    <path d="M1330 457 C1340 449,1350 460,1360 451 S1380 455,1388 447" stroke="#83b6dd" stroke-width="2.5" fill="none"/>

    <!-- model -->
    <rect x="1430" y="217" width="93" height="168" rx="8" fill="#fff" stroke="#98a8b2" stroke-width="3" filter="url(#shadow)"/>
    <text x="1476" y="247" text-anchor="middle" class="body" font-weight="700">Same</text>
    <text x="1476" y="266" text-anchor="middle" class="body" font-weight="700">downstream</text>
    <text x="1476" y="285" text-anchor="middle" class="body" font-weight="700">model</text>
    <g fill="#fff" stroke="#8799a3" stroke-width="1.6">
      <circle cx="1453" cy="318" r="6"/><circle cx="1453" cy="344" r="6"/>
      <circle cx="1477" cy="305" r="6"/><circle cx="1477" cy="331" r="6"/><circle cx="1477" cy="357" r="6"/>
      <circle cx="1501" cy="318" r="6"/><circle cx="1501" cy="344" r="6"/>
      <path d="M1459 318 L1471 305 M1459 318 L1471 331 M1459 344 L1471 331 M1459 344 L1471 357 M1483 305 L1495 318 M1483 331 L1495 318 M1483 331 L1495 344 M1483 357 L1495 344"/>
    </g>

    <!-- outputs -->
    <rect x="1551" y="138" width="45" height="48" rx="6" fill="#fff" stroke="#8bc9a3" stroke-width="3"/>
    <rect x="1551" y="277" width="45" height="48" rx="6" fill="#fff" stroke="#f2b66c" stroke-width="3"/>
    <rect x="1551" y="416" width="45" height="48" rx="6" fill="#fff" stroke="#ef9c9c" stroke-width="3"/>
    <text x="1574" y="168" text-anchor="middle" class="small" font-weight="700" fill="#46a066">High</text>
    <text x="1574" y="307" text-anchor="middle" class="small" font-weight="700" fill="#dd8d2c">Med.</text>
    <text x="1574" y="446" text-anchor="middle" class="small" font-weight="700" fill="#cf4b4b">Low</text>

    <!-- routing -->
    <g class="leader" marker-end="url(#smallArrow)">
      <path d="M1400 148 H1417 V269 H1428"/>
      <path d="M1400 300 H1428"/>
      <path d="M1400 452 H1417 V332 H1428"/>
      <path d="M1523 260 H1538 V162 H1549"/>
      <path d="M1523 301 H1549"/>
      <path d="M1523 342 H1538 V440 H1549"/>
    </g>
  </g>
</svg>
